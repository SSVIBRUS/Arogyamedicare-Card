<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MEDI-PASS | Login</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            background: #f7faff;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #e5ebf2;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            background: #eef6ff;
            font-size: 30px;
        }

        .login-header h1 {
            margin-bottom: 10px;
            color: #172b4d;
        }

        .login-header p {
            color: #667085;
            line-height: 1.5;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .login-form label {
            font-weight: 600;
            margin-bottom: 7px;
            display: block;
            color: #172b4d;
        }

        .login-form input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border: 1px solid #d7e0ea;
            border-radius: 10px;
            font-family: inherit;
            outline: none;
            font-size: 15px;
        }

        .login-form input:focus {
            border-color: #1976d2;
            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.08);
        }

        .login-button {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 10px;
            background: #1976d2;
            color: white;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-button:hover {
            background: #125ca8;
        }

        .login-message {
            display: none;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: center;
        }

        .login-message.error {
            display: block;
            background: #fff0f0;
            color: #c62828;
        }

        .login-message.success {
            display: block;
            background: #edf8f0;
            color: #188038;
        }

        .create-account {
            text-align: center;
            margin-top: 22px;
            color: #667085;
            font-size: 14px;
        }

        .create-account a {
            color: #1976d2;
            font-weight: 700;
            text-decoration: none;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #667085;
            text-decoration: none;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            .login-container {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

    <section class="login-page">

        <div class="login-container">

            <div class="login-header">

                <div class="login-icon">
                    🏥
                </div>

                <h1>Welcome Back</h1>

                <p>
                    Login to access your MEDI-PASS medical dashboard.
                </p>

            </div>

            <div id="loginMessage" class="login-message"></div>

            <form class="login-form" onsubmit="loginUser(event)">

                <div>
                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div>
                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="login-button">
                    🔐 Login to MEDI-PASS
                </button>

            </form>

            <div class="create-account">

                Don't have a MEDI-PASS account?

                <a href="register.html">
                    Create Profile
                </a>

            </div>

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
